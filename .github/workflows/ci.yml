name: ci
on:
  pull_request:
  push:
    branches: [main, development]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # never cancel the run of a push to a protected branch
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags: the version-consistency test compares against the latest one
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: sh tests/run.sh
        env:
          MTH_PYTHON: python  # the interpreter of this matrix cell, not the first one run.sh would find
