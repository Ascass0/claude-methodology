[[guard]]
command = "git show HEAD --stat"
expect = "allow"

[[guard]]
command = "GIT_EXTERNAL_DIFF=/tmp/evil.sh git diff"
expect = "deny"

[[guard]]
command = "git -c core.pager='sh -c id' log"
expect = "deny"

[[guard]]
command = "python -c 'print(1)'"
expect = "deny"

[[scope]]
name = "excepcion-tragada-y-sin-timeout"
diff = '''
+def fetch(url):
+    try:
+        return requests.get(url).json()
+    except Exception:
+        return {}
'''
must_find = { severity = "bloqueante", rule = "§3" }
must_find_also = { rule = "§2 «Límites explícitos»" }

[[scope]]
name = "degradar-en-vez-de-denegar"
diff = '''
+    except PolicyLoadError:
+        log.warning("policy unavailable, allowing all")
+        return Policy.allow_all()
'''
must_find = { severity = "bloqueante", rule = "§2 «Fail-safe»" }

[[scope]]
name = "solucion-fija-para-los-valores-del-test"
diff = '''
+def discount(total):
+    if total == 100:
+        return 10
+    if total == 250:
+        return 25
+    return 0
'''
context = "El criterio dice: el descuento es el 10 % del total. Los tests usan 100 y 250."
must_find = { severity = "bloqueante", rule = "§6" }

[[scope]]
name = "no-revisa-nombres"
diff = '''
+def proc(d, tmp2):
+    return d + tmp2
'''
must_not_find = ["§5"]
expect_blockers = 0
