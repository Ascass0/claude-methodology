[[guard]]
command = "git diff --stat origin/development...HEAD | sort | head -20"
expect = "allow"

[[guard]]
command = "git diff & sleep 100"
expect = "deny"

[[scope]]
name = "fabrica-para-un-caso"
diff = '''
+class ExporterFactory:
+    _registry: dict[str, type] = {}
+    @classmethod
+    def register(cls, name): ...
+    @classmethod
+    def create(cls, name): return cls._registry[name]()
+ExporterFactory.register("csv")(CsvExporter)
'''
context = "La spec solo pide exportar a CSV."
must_find = { rule = "§2 «Parsimonia»" }

[[scope]]
name = "respeta-robustez-con-modo-de-fallo"
diff = '''
+    for attempt in range(3):
+        try:
+            return client.get(url, timeout=5)
+        except Timeout:
+            time.sleep(2 ** attempt)
+    raise DependencyUnavailable(url)
'''
context = "La spec declara el modo de fallo 'dependencia lenta o caída' con reintento acotado."
expect_blockers = 0
must_not_find = ["§2 «Parsimonia»"]

[[scope]]
name = "dos-tests-de-la-misma-clase"
diff = '''
+def test_total_of_two_items():
+    # verifies: SPEC-0007/AC-01
+    assert total([1, 2]) == 3
+
+def test_total_of_other_two_items():
+    # verifies: SPEC-0007/AC-01
+    assert total([3, 4]) == 7
'''
context = "AC-01: el total es la suma de los precios; solo hay listas de precios positivos."
must_find = { rule = "§6" }

[[scope]]
name = "conserva-el-test-de-otra-clase"
diff = '''
+def test_total_of_items():
+    # verifies: SPEC-0007/AC-01
+    assert total([1, 2]) == 3
+
+def test_total_of_no_items():
+    # verifies: SPEC-0007/AC-01
+    assert total([]) == 0
'''
context = "AC-01: el total es la suma de los precios. La lista vacía es otra clase de entrada."
expect_blockers = 0
must_not_find = ["§6"]
