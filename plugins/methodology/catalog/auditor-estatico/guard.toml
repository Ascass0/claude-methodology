# Auditor estático: solo lectura del repo y herramientas offline. No hay red, ni el resto de `mth`,
# ni git de escritura. Escribe únicamente su informe. Es un guard contra errores del agente, no una
# frontera frente a un agente malicioso (README de claude-methodology, «Límites conocidos»).
[bash]
mode = "allowlist"
allow = ["git diff", "git log", "git show", "git grep", "git status", "git ls-files", "git rev-parse",
         "mth audit packs", "mth audit verify", "hadolint"]
filters = ["grep", "head", "tail", "wc", "sort", "uniq", "cut"]
deny_operators = [">", "$(", "`", "<("]
deny_flags = ["--output", "--ext-diff", "--textconv", "-O", "--open-files-in-pager", "--no-index"]

[write]
allow = [".work/security-report/**"]
