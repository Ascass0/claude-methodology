[[guard]]
command = "git grep -n 'class .*Manager'"
expect = "allow"

[[guard]]
command = "git grep -O 'TODO'"
expect = "deny"

[[guard]]
command = "sed -i 's/a/b/' src/app.py"
expect = "deny"

[[scope]]
name = "singleton-y-decorador-sin-wraps"
diff = '''
+_client = HttpClient()
+def get_client():
+    return _client
+
+def traced(fn):
+    def wrapper(*a, **k):
+        log.info("call")
+        return fn(*a, **k)
+    return wrapper
'''
must_find = { rule = "§2 «Dependencias explícitas" }
must_find_also = { rule = "§5 «Decoradores»" }

[[scope]]
name = "no-pide-interfaces-en-script"
diff = '''
+def main() -> None:
+    """Print the build date."""
+    print(date.today().isoformat())
'''
expect_blockers = 0
must_not_find = ["Abierto/cerrado", "Segregación"]

[[guard]]
command = "git diff 2>&1 | head -50"
expect = "allow"

[[guard]]
command = "git log | xargs rm"
expect = "deny"

[[scope]]
name = "excepcion-de-tamano-sin-motivo-que-se-sostenga"
diff = '''
+[[limits.exceptions]]
+path = "src/service.py"
+max_lines = 2500
+reason = "es más cómodo tenerlo todo junto"
'''
context = "src/service.py mezcla acceso a base de datos, reglas de negocio y formato de respuestas."
must_find = { rule = "§5" }

[[scope]]
name = "excepcion-de-tamano-que-se-sostiene"
diff = '''
+[[limits.exceptions]]
+path = "src/parser/grammar.py"
+max_lines = 1400
+reason = "tabla de transiciones del parser, se lee entera y cambia como un único bloque"
'''
expect_blockers = 0
must_not_find = ["§5 «Funciones pequeñas»"]
